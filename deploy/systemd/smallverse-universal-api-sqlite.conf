[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=5

[Service]
# SQLite's read-only connection still creates short-lived lock/shared-memory
# state while running its startup integrity check. ProtectSystem=strict made the
# database look readable but caused an endless five-second restart loop.
ReadOnlyPaths=
ReadWritePaths=/opt/smallverse-universal/workspace

# Keep a malformed query or unexpectedly large response from threatening the
# host. The API is a read surface and should never need significant memory.
MemoryHigh=192M
MemoryMax=256M
MemorySwapMax=64M
RestartSec=30
