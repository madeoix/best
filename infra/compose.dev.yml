services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: smallverse
      POSTGRES_USER: smallverse
      POSTGRES_PASSWORD: smallverse-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smallverse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smallverse -d smallverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smallverse
      MINIO_ROOT_PASSWORD: smallverse-development-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - smallverse-minio:/data

volumes:
  smallverse-postgres:
  smallverse-minio:
